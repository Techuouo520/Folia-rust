[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["test"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
repository = "https://github.com/Techuouo520/Folia-rust"

[workspace.dependencies]
folia-core = { path = "crates/folia-core" }
folia-store = { path = "crates/folia-store" }
folia-i18n = { path = "crates/folia-i18n" }
folia-ui = { path = "crates/folia-ui" }
folia-lyrics = { path = "crates/folia-lyrics" }
folia-library = { path = "crates/folia-library" }
folia-omni = { path = "crates/folia-omni" }
folia-player = { path = "crates/folia-player" }
folia-visualizer = { path = "crates/folia-visualizer" }
folia-render = { path = "crates/folia-render" }

aes = "=0.8.4"
anyhow = "1.0.104"
base64 = "0.23.1"
bytemuck = "1.25.2"
wgpu = "27.0.1"
cpal = "0.18.2"
directories = "6.0.0"
encoding_rs = "0.8.44"
flate2 = "=1.1.10"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
icu_segmenter = { version = "2.4.0", default-features = false, features = ["compiled_data"] }
lyon_path = "1.0.19"
iced = { version = "0.14.0", features = ["advanced", "canvas", "image-without-codecs", "svg", "tokio"] }
keyring = "=4.2.0"
librespot-audio = { version = "=0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-core = { version = "=0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-metadata = { version = "=0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
lofty = "0.25.5"
lucide-static-svg = "1.65.0"
md-5 = "=0.10.6"
num-bigint = "=0.4.8"
open = "=5.3.2"
qrcode = { version = "=0.14.1", default-features = false }
quick-xml = "0.42.0"
rayon = "1.12.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form"] }
rfd = "0.17.2"
ring = "=0.17.14"
rtrb = "0.4.1"
rubato = "5.0.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", features = ["all"] }
sys-locale = "0.3.2"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["sync"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5.0"
winresource = { version = "0.1.34", default-features = false }
zhconv = "0.4.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
