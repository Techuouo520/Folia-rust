[workspace]
resolver = "3"
members = ["core", "media", "store", "i18n", "lyrics", "library", "player", "visualizer", "omni", "ui", "render", "analysis", "ai", "acoustics", "visual/lumiere", "visual/monet", "bench/player"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
lofty = "0.25.5"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
folia-core = { path = "../crates/folia-core" }
folia-media = { path = "../crates/folia-media" }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
tokio = { version = "1.54.1", features = ["rt", "time", "net", "macros"] }
futures-util = "0.3.34"
url = "2.5.8"
folia-ai = { path = "../crates/folia-ai" }
folia-acoustics = { path = "../crates/folia-acoustics" }
folia-store = { path = "../crates/folia-store" }
folia-i18n = { path = "../crates/folia-i18n" }
folia-lyrics = { path = "../crates/folia-lyrics" }
folia-library = { path = "../crates/folia-library" }
folia-player = { path = "../crates/folia-player" }
folia-visualizer = { path = "../crates/folia-visualizer" }
folia-omni = { path = "../crates/folia-omni" }
folia-ui = { path = "../crates/folia-ui" }
folia-render = { path = "../crates/folia-render" }
folia-analysis = { path = "../crates/folia-analysis" }
bytemuck = { version = "1.25.2", features = ["derive"] }
iced = { version = "0.14.0", default-features = false, features = ["advanced", "canvas", "crisp", "image-without-codecs", "linux-theme-detection", "svg", "thread-pool", "tokio", "wayland", "web-colors", "wgpu", "x11"] }
iced_wgpu = "=0.14.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
pollster = "0.4.0"
wgpu = "27.0.1"
winit = "=0.30.13"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_StationsAndDesktops", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
rqrr = "0.11.0"
tempfile = "3.27.0"
toml = "1.1.8"
serde_json = "1.0"
criterion = "0.8.2"

[patch.crates-io]
cryoglyph = { path = "../crates/cryoglyph" }

# File and line numbers in backtraces without full debug info; keeps target/ a fraction of the size.
[profile.dev]
debug = "line-tables-only"
