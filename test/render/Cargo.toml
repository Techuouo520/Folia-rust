[package]
name = "test-render"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[[bin]]
name = "remote-window-probe"
path = "remote_probe.rs"
required-features = ["stress"]

[dependencies]
tempfile.workspace = true
folia-core.workspace = true
folia-store.workspace = true
folia-i18n.workspace = true
folia-render.workspace = true
folia-ui.workspace = true
folia-omni.workspace = true
folia-visualizer.workspace = true
iced.workspace = true
iced_runtime = "0.14.0"
iced_wgpu = "=0.14.0"
image.workspace = true
pollster.workspace = true
toml.workspace = true
serde_json.workspace = true
wgpu.workspace = true

[target.'cfg(windows)'.dependencies]
winit.workspace = true
windows-sys.workspace = true

[features]
default = ["dev"]
dev = ["folia-visualizer/dev"]
# Set by CI: skips tests that need a hardware GPU.
ci = []
stress = []
