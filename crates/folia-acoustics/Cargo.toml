[package]
name = "folia-acoustics"
description = "Native Steam Audio room impulse-response simulation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
folia-core.workspace = true
folia-store.workspace = true
libloading.workspace = true
ring.workspace = true
rusqlite.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Unsafe is restricted to the generated ABI and the checked audio-simulation boundary.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
