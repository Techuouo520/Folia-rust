[package]
name = "folia-omni"
description = "Online music facade and platform providers for Folia"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["netease", "kugou", "qq", "bodian", "qishui", "spotify", "ytm"]
netease = []
kugou = ["dep:flate2", "dep:num-bigint"]
qq = ["dep:flate2", "dep:num-bigint"]
bodian = []
qishui = ["dep:ring"]
spotify = ["dep:ring", "dep:librespot-audio", "dep:librespot-core", "dep:librespot-metadata"]
ytm = []

[dependencies]
folia-core.workspace = true
folia-lyrics.workspace = true
aes.workspace = true
base64.workspace = true
flate2 = { workspace = true, optional = true }
image.workspace = true
keyring.workspace = true
librespot-audio = { workspace = true, optional = true }
librespot-core = { workspace = true, optional = true }
librespot-metadata = { workspace = true, optional = true }
md-5.workspace = true
num-bigint = { workspace = true, optional = true }
qrcode.workspace = true
reqwest.workspace = true
ring = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[lints]
workspace = true
