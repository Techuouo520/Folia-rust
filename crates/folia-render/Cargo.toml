[package]
name = "folia-render"
description = "Shared wgpu passes for Folia: vignette, grain and the subtitle glow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
folia-core.workspace = true
unicode-script.workspace = true
unicode-vo.workspace = true
bytemuck = { workspace = true, features = ["derive"] }
iced.workspace = true
iced_wgpu.workspace = true
parking_lot.workspace = true
tracing.workspace = true
thiserror.workspace = true
wgpu.workspace = true
winit.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

# Win32 compositor interop is confined to native_frame; all other render code denies unsafe.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[features]
dev = []
